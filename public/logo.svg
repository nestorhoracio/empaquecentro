<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;display=swap');
    </style>
  </defs>

  <!-- Oval border -->
  <ellipse cx="200" cy="145" rx="185" ry="118" fill="white" stroke="#3D3DAF" stroke-width="7"/>

  <!-- CENTRO -->
  <text
    x="200"
    y="118"
    font-family="Gontserrat, Arial Black, sans-serif"
    font-weight="800"
    font-size="68"
    fill="#3D3DAF"
    text-anchor="middle"
    letter-spacing="-1"
  >CENTRO</text>

  <!-- EMPAQUE -->
  <text
    x="200"
    y="192"
    font-family="Gontserrat, Arial Black, sans-serif"
    font-weight="800"
    font-size="68"
    fill="#3D3DAF"
    text-anchor="middle"
    letter-spacing="-1"
  >EMPAQUE</text>

  <!-- DISTRIBUIDORA en arco inferior -->
  <defs>
    <path id="arc" d="M 48,200 A 160,160 0 0,0 352,200"/>
  </defs>
  <text
    font-family="Gontserrat, Arial Black, sans-serif"
    font-weight="800"
    font-size="28"
    fill="#3D3DAF"
    letter-spacing="3"
  >
    <textPath href="#arc" startOffset="50%" text-anchor="middle">DISTRIBUIDORA</textPath>
  </text>
</svg>
